name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - run: bun install --frozen-lockfile

      - name: Lint et format
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Feature-Sliced Design
        run: bun run fsd
